<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กำลังเชื่อมต่อ LINE...</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
</head>
<body>
<p style="text-align:center;margin-top:40px;font-family:sans-serif;">กำลังเชื่อมต่อบัญชี LINE...</p>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyDda5v7a1ZlWl6VJ6Te-S8Q6Q8inuCECK0",
    authDomain: "bachelor-edu-system.firebaseapp.com",
    projectId: "bachelor-edu-system",
    appId: "1:555108991120:web:cf7bfee14a48fdabc25815"
  });

  const fns = firebase.functions();
  const params = new URLSearchParams(location.search);

  (async () => {
    try {
      const res = await fns.httpsCallable("lineLoginCallback")({
        code: params.get("code"),
        state: params.get("state")
      });
      // ส่งโทเคนไปให้หน้าหลักล็อกอินต่อให้อัตโนมัติ
      location.replace("/?lt=" + encodeURIComponent(res.data.loginToken) + "&linked=1");
    } catch (err) {
      alert("เชื่อมต่อไม่สำเร็จ: " + err.message);
      location.replace("/");
    }
  })();
</script>
</body>
</html>
